<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Imal Madhusanka — Photography</title>
<meta name="theme-color" content="#080706">
<meta name="description" content="Imal Madhusanka — Professional Photographer. Sri Lanka.">
<meta property="og:title" content="Imal Madhusanka Photography">
<meta property="og:description" content="Professional Photographer — tap to call, mail or save my contact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080706;
  --card:#131110;
  --edge:rgba(198,160,74,.16);
  --gold:#C6A04A;
  --gold-hi:#F2E0AE;
  --gold-dim:#8A7442;
  --paper:#E7E2D8;
  --mute:#8E877C;
  --rail:24px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100svh;display:flex;justify-content:center;overflow-x:hidden;
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.watermark{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:var(--markimg) no-repeat -16% 46%/155% auto;
  opacity:.04;filter:grayscale(1) brightness(3);
}
.sheet{
  position:relative;z-index:1;width:100%;max-width:430px;
  padding:calc(env(safe-area-inset-top) + 34px) var(--rail) calc(env(safe-area-inset-bottom) + 40px);
  display:flex;flex-direction:column;
}

/* ---------- the real card, front & back ---------- */
.stage{perspective:1400px}
.flip{
  position:relative;width:100%;aspect-ratio:1063/650;
  transform-style:preserve-3d;
  transition:transform .75s cubic-bezier(.6,.02,.2,1);
  cursor:pointer;border-radius:12px;
}
.flip.turned{transform:rotateY(180deg)}
.flip:focus-visible{outline:2px solid var(--gold);outline-offset:6px}
.face{
  position:absolute;inset:0;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  border-radius:12px;overflow:hidden;
  border:1px solid rgba(198,160,74,.2);
  box-shadow:0 26px 50px -18px rgba(0,0,0,.9);
}
.face img{display:block;width:100%;height:100%;object-fit:cover}
.face.rear{transform:rotateY(180deg)}
/* light travelling across the foil as the phone tilts */
.face::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(102deg,transparent 34%,rgba(255,244,214,.30) 50%,transparent 66%);
  background-size:260% 100%;
  background-position:calc(50% + var(--tilt,0%)) 0;
  mix-blend-mode:soft-light;
  transition:background-position .18s linear;
}
.hint{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:16px 0 0;font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;
  color:#5C554B;transition:opacity .4s ease;
}
.hint.gone{opacity:0}
.hint svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.6}

.rule{height:1px;margin:34px 0 26px;background:linear-gradient(90deg,transparent,var(--edge) 22%,var(--edge) 78%,transparent)}

/* ---------- contact rows ---------- */
.rows{display:flex;flex-direction:column;gap:10px}
.row{
  display:flex;align-items:center;gap:15px;padding:13px 15px;
  background:var(--card);border:1px solid rgba(255,255,255,.045);border-radius:14px;
  text-decoration:none;color:var(--paper);
  transition:border-color .2s ease,transform .12s ease,background .2s ease;
}
.row:hover,.row:focus-visible{border-color:var(--edge);background:#181514}
.row:active{transform:scale(.985)}
.row:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.glyph{flex:0 0 36px;height:36px;display:grid;place-items:center;border:1px solid var(--gold-dim);border-radius:50%}
.glyph svg{width:16px;height:16px;fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rtext{min-width:0}
.rlabel{display:block;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.rvalue{display:block;font-size:13.5px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- scan panel ---------- */
.scan{margin-top:30px;display:flex;flex-direction:column;align-items:center}
.scan-label{font-family:"Jost",sans-serif;font-size:10px;letter-spacing:.34em;text-indent:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.qr{width:168px;height:168px;padding:11px;background:#fff;border-radius:8px;box-shadow:0 14px 30px -14px rgba(0,0,0,.85)}
.qr img{display:block;width:100%;height:100%;image-rendering:pixelated}
.scan-note{margin:13px 0 0;font-size:11px;letter-spacing:.05em;color:#5C554B;text-align:center}

/* ---------- actions ---------- */
.actions{display:flex;flex-direction:column;gap:10px;margin-top:30px}
.btn{
  appearance:none;border:0;cursor:pointer;width:100%;padding:16px;border-radius:14px;
  font-family:"Jost",sans-serif;font-size:12px;font-weight:500;
  letter-spacing:.26em;text-indent:.26em;text-transform:uppercase;
  transition:transform .12s ease,filter .2s ease;
}
.btn:active{transform:scale(.985)}
.btn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.btn-gold{background:linear-gradient(155deg,#D9B75E,#A8873A);color:#100D08}
.btn-gold:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent;border:1px solid var(--edge);color:var(--gold)}
.btn-ghost:hover{background:rgba(198,160,74,.06)}

.foot{margin-top:32px;text-align:center;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#4E4941}

@media (prefers-reduced-motion:reduce){
  .flip{transition:none}
  .face::after{transition:none;display:none}
}
</style>
</head>

/* ---- flip ---- */
(function(){
  const flip = document.getElementById('flip'), hint = document.getElementById('hint');
  const turn = () => { flip.classList.toggle('turned'); hint.classList.add('gone'); };
  flip.addEventListener('click', turn);
  flip.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); turn(); }
  });
})();

/* ---- foil sheen follows the tilt of the phone ---- */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const set = v => document.documentElement.style.setProperty('--tilt', v.toFixed(1) + '%');
  window.addEventListener('deviceorientation', e => {
    if (e.gamma == null) return;
    set(Math.max(-45, Math.min(45, e.gamma)) * 1.5);
  });
  window.addEventListener('pointermove', e => set((e.clientX / window.innerWidth - .5) * 85));
})();

document.getElementById('saveBtn').addEventListener('click', () => {
  const blob = new Blob([VCARD], {type:'text/vcard;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Imal-Madhusanka.vcf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

/* ---- share ---- */
document.getElementById('shareBtn').addEventListener('click', async () => {
  const btn = document.getElementById('shareBtn');
  const data = {title:'Imal Madhusanka Photography', text:'My card', url:location.href};
  if (navigator.share) { try { await navigator.share(data); } catch(e){} return; }
  try {
    await navigator.clipboard.writeText(location.href);
    btn.textContent = 'Link copied';
    setTimeout(() => btn.textContent = 'Share this card', 1800);
  } catch(e) { btn.textContent = location.href; }
});
