<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Imal Madhusanka — Photography</title>
<meta name="theme-color" content="#080706">
<meta name="description" content="Imal Madhusanka — Professional Photographer. Sri Lanka.">
<meta property="og:title" content="Imal Madhusanka Photography">
<meta property="og:description" content="Professional Photographer — tap to call, mail or save my contact.">
<meta property="og:type" content="profile">

<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#080706;
  --card:#131110;
  --edge:rgba(198,160,74,.16);
  --gold:#C6A04A;
  --gold-hi:#F2E0AE;
  --gold-dim:#8A7442;
  --paper:#E7E2D8;
  --mute:#8E877C;
  --rail:26px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100svh;
  display:flex;justify-content:center;
  overflow-x:hidden;
}

/* faint oversized mark, same as the back of the printed card */
.watermark{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:var(--markimg);
  background-repeat:no-repeat;
  background-position:-14% 42%;
  background-size:150% auto;
  opacity:.045;
  filter:grayscale(1) brightness(3);
}

.sheet{
  position:relative;z-index:1;
  width:100%;max-width:430px;
  padding:calc(env(safe-area-inset-top) + 52px) var(--rail) calc(env(safe-area-inset-bottom) + 40px);
  display:flex;flex-direction:column;
}

/* ---------- foil crest ---------- */
.crest{display:flex;flex-direction:column;align-items:center;text-align:center}
.mark{
  position:relative;
  width:172px;height:97px;
  -webkit-mask-image:var(--markimg);mask-image:var(--markimg);
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  background:
    linear-gradient(100deg,
      var(--gold-dim) 0%,
      var(--gold) 26%,
      var(--gold-hi) 42%,
      var(--gold) 58%,
      var(--gold-dim) 86%);
  background-size:280% 100%;
  background-position:calc(50% + var(--tilt,0%)) 0;
  transition:background-position .18s linear;
}
.wordmark{
  margin:22px 0 0;
  font-family:"Jost",-apple-system,sans-serif;
  font-weight:400;font-size:20px;line-height:1.35;
  letter-spacing:.30em;text-indent:.30em;
  text-transform:uppercase;
  background:linear-gradient(100deg,var(--gold-dim) 0%,var(--gold) 28%,var(--gold-hi) 44%,var(--gold) 60%,var(--gold-dim) 88%);
  background-size:280% 100%;
  background-position:calc(50% + var(--tilt,0%)) 0;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  transition:background-position .18s linear;
}
.role{
  margin:12px 0 0;
  font-size:11px;letter-spacing:.34em;text-indent:.34em;
  text-transform:uppercase;color:var(--mute);
}

.rule{height:1px;margin:38px 0 30px;background:linear-gradient(90deg,transparent,var(--edge) 22%,var(--edge) 78%,transparent)}

/* ---------- contact rows ---------- */
.rows{display:flex;flex-direction:column;gap:10px}
.row{
  display:flex;align-items:center;gap:16px;
  padding:14px 16px;
  background:var(--card);
  border:1px solid rgba(255,255,255,.045);
  border-radius:14px;
  text-decoration:none;color:var(--paper);
  transition:border-color .2s ease,transform .12s ease,background .2s ease;
}
.row:hover,.row:focus-visible{border-color:var(--edge);background:#181514}
.row:active{transform:scale(.985)}
.row:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.glyph{
  flex:0 0 38px;height:38px;
  display:grid;place-items:center;
  border:1px solid var(--gold-dim);border-radius:50%;
}
.glyph svg{width:17px;height:17px;fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.rtext{min-width:0}
.rlabel{display:block;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.rvalue{display:block;font-size:14px;letter-spacing:.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- actions ---------- */
.actions{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.btn{
  appearance:none;border:0;cursor:pointer;width:100%;
  padding:16px;border-radius:14px;
  font-family:"Jost",sans-serif;font-size:12px;font-weight:500;
  letter-spacing:.26em;text-indent:.26em;text-transform:uppercase;
  transition:transform .12s ease,filter .2s ease;
}
.btn:active{transform:scale(.985)}
.btn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.btn-gold{background:linear-gradient(155deg,#D9B75E,#A8873A);color:#100D08}
.btn-gold:hover{filter:brightness(1.07)}
.btn-ghost{background:transparent;border:1px solid var(--edge);color:var(--gold)}
.btn-ghost:hover{background:rgba(198,160,74,.06)}

.foot{margin-top:34px;text-align:center;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#4E4941}

@media (prefers-reduced-motion:reduce){
  .mark,.wordmark{transition:none}
}
</style>
</head>

/* ---- foil sheen: the gold catches light as the phone tilts ---- */
(function(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const set = v => document.documentElement.style.setProperty('--tilt', v.toFixed(1) + '%');
  window.addEventListener('deviceorientation', e => {
    if (e.gamma == null) return;
    set(Math.max(-45, Math.min(45, e.gamma)) * 1.6);
  });
  window.addEventListener('pointermove', e => {
    set((e.clientX / window.innerWidth - .5) * 90);
  });
})();

document.getElementById('saveBtn').addEventListener('click', () => {
  const blob = new Blob([VCARD], {type:'text/vcard;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Imal-Madhusanka.vcf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

/* ---- share ---- */
document.getElementById('shareBtn').addEventListener('click', async () => {
  const btn = document.getElementById('shareBtn');
  const data = {title:'Imal Madhusanka Photography', text:'My card', url:location.href};
  if (navigator.share) { try { await navigator.share(data); } catch(e){} return; }
  try {
    await navigator.clipboard.writeText(location.href);
    btn.textContent = 'Link copied';
    setTimeout(() => btn.textContent = 'Share this card', 1800);
  } catch(e) {
    btn.textContent = location.href;
  }
});
